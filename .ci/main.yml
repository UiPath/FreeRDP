- task: DotNetCoreCLI@2
  displayName: 'Test FreeRdpClient'
  condition: succeededOrFailed()
  inputs:
    command: 'test'
    arguments: '--no-build /p:Configuration=Release'
    projects: 'UiPath.FreeRdpClient\UiPath.FreeRdpClient.Tests\UiPath.FreeRdp.Tests.csproj'

- task: NuGetCommand@2
  displayName: 'NuGet Push to UiPath-Internal'
  inputs:
    command: push
    packagesToPush: 'Output\nugets\UiPath.FreeRdpClient.*.nupkg'
    publishVstsFeed: '5b98d55c-1b14-4a03-893f-7a59746f1246/788028a9-5a01-48ee-b925-3af51ae46294'

