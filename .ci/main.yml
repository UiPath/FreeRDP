name: $(Date:yyyyMMdd)$(Rev:-rr)


resources:
  repositories:
  - repository: common
    type: github
    name: UiPath/AzurePipelinesTemplates
    ref: refs/tags/uipath.retain.build.1.0.1
    endpoint: "GitHub connection"

pool:
  vmImage: 'windows-2022'
  demands:
  - msbuild
  - visualstudio

parameters:
- name: listOfScripts
  type: object
  default:
  - getOpenSsl
  - buildOpenSsl
  - buildFreeRDP
  - buildFreeRdpWrapper

steps:
- task: CmdLine@2
  name: getVersions
  inputs:
    script: |
      call .ci\Scripts\getVars
      set
      
      cmake --version
      perl -v
      msbuild -version
- ${{ each value in parameters.listOfScripts }}:
  - task: BatchScript@1
    name: ${{ value }}
    inputs:
      filename: .ci\Scripts\${{ value }}