name: $(Date:yyyyMMdd)$(Rev:-rr)

trigger: 
  - uipath

pool:
  vmImage: 'windows-2022'
  demands:
  - msbuild
  - visualstudio

steps:
- task: NuGetToolInstaller@1
  displayName: 'Use NuGet'

- task: NuGetAuthenticate@0

- script: |
    call .ci\Scripts\getVars
   
    cmake --version
    perl -v
    msbuild -version

    set
  name: getVersions

- script: .\.ci\Scripts\getOpenSsl
  displayName: getOpenSsl
- script: .\.ci\Scripts\buildOpenSsl
  displayName: buildOpenSsl
- script: .\.ci\Scripts\buildFreeRDP
  displayName: buildFreeRDP
#- script: .\.ci\Scripts\buildFreeRdpWrapper
#  displayName: buildFreeRdpWrapper

- task: NuGetCommand@2
  inputs:
    command: 'restore'
    restoreSolution: 'UiPath.FreeRdpClient\UiPath.FreeRdpClient.sln'

- task: MSBuild@1
  condition: succeededOrFailed()
  displayName: msbuild FreeRdpWrapper build
  inputs:
    solution: 'UiPath.FreeRdpClient\UiPath.FreeRdpClient.sln' 
    platform: 'x64'
    configuration: 'Release'
    msbuildArchitecture: 'x64'


#- script: .\.ci\Scripts\TestFreeRdpClient.bat
