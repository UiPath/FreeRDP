name: $(Date:yyyyMMdd)$(Rev:-rr)

trigger: 
  - uipath

pool:
  vmImage: 'windows-2022'
  demands:
  - msbuild
  - visualstudio

steps:
- task: CmdLine@2
  name: getVersions
  inputs:
    script: |
      call .ci\Scripts\getVars
      set
      
      cmake --version
      perl -v
      msbuild -version

- powershell: .\.ci\Scripts\getOpenSsl
  displayName: getOpenSsl
- powershell: .\.ci\Scripts\buildOpenSsl
  displayName: buildOpenSsl
- powershell: .\.ci\Scripts\buildFreeRDP
  displayName: buildFreeRDP
- powershell: .\.ci\Scripts\buildFreeRdpWrapper
  displayName: buildFreeRdpWrapper

- powershell: if ((Get-ChildItem -Path Output -Filter *.dll -Recurse -Name | Measure-Object).Count -ne 4) {throw "not all output there"}
  displayName: Check output


- task: PublishPipelineArtifact@1
  name: publishFreeRDPWrapper
  inputs:
    targetPath: 'Output\bin' 
    artifactName: 'freeRdpWrapper'
    parallel: true

- task: PublishPipelineArtifact@1
  name: publishFreeRDPOnly
  inputs:
    targetPath: '.' 
    artifactName: 'freeRdpOnly' 
    parallel: true

- task: PublishPipelineArtifact@1
  name: publishOpenSSL32
  inputs:
    targetPath: '..\OpenSSL-VC-32' 
    artifactName: 'openSSL-32' 
    parallel: true

- task: PublishPipelineArtifact@1
  name: publishOpenSSL64
  inputs:
    targetPath: '..\OpenSSL-VC-64' 
    artifactName: 'openSSL-64' 
    parallel: true

